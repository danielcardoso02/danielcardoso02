name: Generate Tetris Animation

on:
  schedule:
    - cron: "0 0 * * *" # Runs every day at midnight UTC
  workflow_dispatch:    # Adds a button so you can run it manually anytime

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests Pillow

      - name: Generate Tetris GIF
        env:
          # The built-in token can read the public contribution calendar,
          # so no personal access token (which expires) is needed.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python animate.py

      - name: Commit and Push Animation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add github-tetris.gif
          git commit -m "🤖 Auto-update Tetris graph" || exit 0
          git push
